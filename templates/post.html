<h1>
  {% if post-link %}
  <a href="{{post-link}}">
  {% endif %}
  {{title}}
  {% if post-link %}
  </a>
  {% endif %}
</h1>
<p class="post-meta">
  <time>{{date}}</time>
  {% for tag in tags %}
  <span class="tag"><a href="tags/{{tag|escape-tag}}.html">{{tag}}</a></span>
  {% endfor %}
</p>
{{body | safe}}
