{% for post in posts %}
    <div>
        <h1><a href="{{post.post-link}}">{{post.title}}</a></h1>
        <p class="post-meta">
            <time>{{post.date}}</time>
            {% for tag in post.tags %}
            <span class="tag"><a href="tags/{{tag|escape-tag}}.html">{{tag}}</a></span>
            {% endfor %}
        </p>
        {{post.body | safe}}
        {% if post.truncated %}
            <p><a href="{{post.post-link}}">Continue reading</a></p>
        {% endif %}
    </div>
    {% if not forloop.last %}<hr class="post-separator">{% endif %}
{% endfor %}
