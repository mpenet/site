<div>
    <h1>{{title}}</h1>
    {% for post-group in post-groups %}
    <h2 class="archive-year">{{post-group.year}}</h2>
    <ul class="index">
        {% for post-link in post-group.post-links %}
            <li><time>{{post-link.date}}</time><a href="{{post-link.url}}">{{post-link.title}}</a></li>
        {% endfor %}
    </ul>
    {% endfor %}
</div>
